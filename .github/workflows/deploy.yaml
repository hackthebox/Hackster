name: Build & Push

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' || contains(github.ref_name, '-rc') }}

jobs:
  set-environment:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-rc') && 'production' || 'development' }}
    outputs:
      role: ${{ steps.vars.outputs.role }}
      repository: ${{ steps.vars.outputs.repository }}
      registry: ${{ steps.vars.outputs.registry }}
    steps:
      - id: vars
        run: |
          echo "role=${{ vars.AWS_GITHUB_ROLE }}" >> "$GITHUB_OUTPUT"
          echo "repository=${{ vars.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"
          echo "registry=${{ vars.ECR_REGISTRY }}" >> "$GITHUB_OUTPUT"

  build:
    needs: set-environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine image tag
        id: config
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "$GITHUB_REF_NAME" != *-rc* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            IMAGE_TAG="$VERSION"
          else
            TIMESTAMP="$(date +%s)"
            SHORT_SHA="$(git rev-parse HEAD | cut -c1-7)"
            VERSION="$(git describe --tags --always)"
            IMAGE_TAG="${TIMESTAMP}-${SHORT_SHA}"
          fi
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Read registry
        id: registry
        env:
          ECR_REGISTRY: ${{ needs.set-environment.outputs.registry }}
        run: |
          set -euo pipefail
          if [[ "$ECR_REGISTRY" =~ ^([0-9]+)\.dkr\.ecr\.([a-z0-9-]+)\.amazonaws\.com$ ]]; then
            echo "account_id=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "region=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::ECR_REGISTRY must be the registry host"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ needs.set-environment.outputs.role }}
          aws-region: ${{ steps.registry.outputs.region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        with:
          registries: ${{ steps.registry.outputs.account_id }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ needs.set-environment.outputs.repository }}:${{ steps.config.outputs.image_tag }}
          build-args: |
            VERSION=${{ steps.config.outputs.version }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ needs.set-environment.outputs.repository }}:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ needs.set-environment.outputs.repository }}:buildcache,mode=max
